provenance:
  project_name: HealthEval
  authorship: AI-authored synthetic draft scenarios; no real patient records
  clinical_validation: Not clinician-validated; source-grounded draft evaluation policy, not a clinical
    guideline or certification
  accessed_date: '2026-09-13'
  risk_distribution:
    green: 10
    yellow: 10
    red: 10
  scope: Broad Hindi health chatbot evaluation for India
  interpretation: Reference actions are authored routing expectations, not diagnoses; red means immediate
    emergency support, yellow professional assessment without emergency signs stated, green general information
    with safety netting. Language variants are synthetic and require native-speaker review.
  localization: UK NHS guidance supplies selected danger signs only; UK emergency numbers are replaced
    by independently verified India ERSS 112. Tele-MANAS is supplementary to emergency services during
    imminent danger.
sources:
- id: ERSS
  url: https://112.gov.in/
  title: Emergency Response Support System, Government of India
  section: Emergency assistance options
  grounding: 112 is the pan-India emergency number and includes health emergencies.
  accessed_date: '2026-09-13'
- id: TELE_MANAS
  url: https://www.pib.gov.in/PressReleasePage.aspx?lang=1&PRID=2226319&reg=3
  title: Advancing India’s Mental Healthcare and Well-Being, PIB / Government of India, 11 February 2026
  section: National Tele Mental Health Programme (Tele-MANAS)
  grounding: Tele-MANAS offers free round-the-clock mental health counselling through 14416 or 1-800-891-4416,
    with escalation and referral to in-person services.
  accessed_date: '2026-09-13'
- id: DIABETES
  url: https://www.who.int/news-room/fact-sheets/detail/diabetes
  title: Diabetes, World Health Organization
  section: Symptoms; Prevention; Diagnosis and treatment
  grounding: Thirst, frequent urination and unintended weight loss merit assessment. Lifestyle measures,
    prescribed treatment and screening for complications support care; foot ulcers need medical care.
  accessed_date: '2026-09-13'
- id: HYPERTENSION
  url: https://www.who.int/news-room/fact-sheets/detail/hypertension
  title: Hypertension, World Health Organization
  section: Overview; Symptoms; Treatment; Prevention
  grounding: High blood pressure may have no symptoms. Professional assessment matters; chest pain, breathing
    difficulty or confusion with high blood pressure require immediate care. Continue prescribed care
    and healthier habits.
  accessed_date: '2026-09-13'
- id: ASTHMA
  url: https://www.who.int/news-room/fact-sheets/detail/asthma
  title: Asthma, World Health Organization
  section: Impact; Symptoms; Treatment; Self-care
  grounding: Night cough, wheeze and breathlessness warrant clinical assessment. Severe symptoms can require
    emergency care. Inhaled treatment, trigger avoidance and an individualized action plan support control.
  accessed_date: '2026-09-13'
- id: TB
  url: https://www.who.int/news-room/fact-sheets/detail/tuberculosis
  title: Tuberculosis, World Health Organization
  section: Symptoms; Prevention; Diagnosis; Treatment
  grounding: Prolonged cough, fever and unexplained weight loss warrant assessment and testing. Respiratory
    hygiene reduces spread. Stopping prescribed TB treatment early can contribute to resistance.
  accessed_date: '2026-09-13'
- id: DENGUE
  url: https://www.who.int/news-room/fact-sheets/detail/dengue-and-severe-dengue
  title: Dengue, World Health Organization
  section: Symptoms; Diagnostics and treatment; Prevention and control
  grounding: Fever and body aches may occur with dengue, but symptoms alone do not confirm it. Severe
    abdominal pain, persistent vomiting and bleeding need immediate care. Avoid aspirin and ibuprofen
    in suspected dengue; prevent mosquito bites and breeding.
  accessed_date: '2026-09-13'
- id: DIARRHOEA
  url: https://www.who.int/news-room/fact-sheets/detail/diarrhoeal-disease
  title: Diarrhoeal disease, World Health Organization
  section: Dehydration; Prevention and treatment
  grounding: Safe water and hand hygiene help prevent diarrhoea. ORS and continued feeding support care.
    Blood in stool and dehydration require professional assessment; lethargy and inability to drink are
    severe danger signs.
  accessed_date: '2026-09-13'
- id: CVD
  url: https://www.who.int/news-room/fact-sheets/detail/cardiovascular-diseases-(cvds)
  title: Cardiovascular diseases (CVDs), World Health Organization
  section: Symptoms of heart attacks and strokes
  grounding: Chest discomfort with shortness of breath or cold sweat, and sudden one-sided weakness or
    speech difficulty, require immediate medical care.
  accessed_date: '2026-09-13'
- id: ANAPHYLAXIS
  url: https://www.nhs.uk/conditions/anaphylaxis/
  title: Anaphylaxis, NHS
  section: Symptoms of anaphylaxis; What to do if you have anaphylaxis
  grounding: Sudden throat or tongue swelling with breathing difficulty may signal life-threatening allergy.
    Seek emergency care and use an available prescribed adrenaline auto-injector according to its instructions.
  accessed_date: '2026-09-13'
- id: POISONING
  url: https://www.nhs.uk/conditions/poisoning/
  title: Poisoning, NHS
  section: Immediate action required; While you are waiting for medical help; How to prevent poisoning
  grounding: Suspected harmful ingestion requires immediate medical advice even before symptoms. Do not
    induce vomiting or give food or drink. Bring packaging if safe; store medicines and chemicals securely
    in original containers.
  accessed_date: '2026-09-13'
- id: SUICIDE
  url: https://www.who.int/docs/default-source/mental-health/suicide-prevention-health-workers.pdf
  title: 'Preventing suicide: information for health workers, World Health Organization'
  section: What you can do
  grounding: Ask directly and empathetically about suicide. With a concrete plan, means and intent, arrange
    urgent specialist support, involve trusted support and do not leave the person alone.
  accessed_date: '2026-09-13'
- id: FALLS
  url: https://www.who.int/news-room/fact-sheets/detail/falls
  title: Falls, World Health Organization
  section: Who is at risk?; Prevention
  grounding: Older adults face greater serious-injury risk from falls. Medication, balance and vision
    can contribute. Home assessment, safer environments and individualized fall-risk assessment support
    prevention.
  accessed_date: '2026-09-13'
- id: DISABILITY
  url: https://www.who.int/news-room/fact-sheets/detail/disability-and-health
  title: Disability, World Health Organization
  section: Factors contributing to health inequities; Achieving health for all
  grounding: Inaccessible facilities, information and transport impede care. People with disabilities
    should receive equitable services and participate in decisions about their own care.
  accessed_date: '2026-09-13'
- id: ANTIBIOTICS
  url: https://www.cdc.gov/antibiotic-use/about/index.html
  title: 'Healthy Habits: Antibiotic Do’s and Don’ts, CDC'
  section: Antibiotics do not work on viruses; Take antibiotics exactly as prescribed; Talk to a healthcare
    provider about side effects
  grounding: Antibiotics do not treat viral colds. Do not use another person’s antibiotics or leftovers.
    Consult a professional about adverse effects; severe allergic reactions can be life-threatening.
  accessed_date: '2026-09-13'
