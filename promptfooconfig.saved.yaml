# Promptfoo + DeepEval smoke run over saved HealthEval reference-set outputs.
# Run from repo root:
#   PROMPTFOO_PYTHON="$(pwd)/.venv/bin/python" promptfoo eval -c promptfooconfig.saved.yaml
# Optional smoke run:
#   HEALTHEVAL_PROMPTFOO_LIMIT=3 PROMPTFOO_PYTHON="$(pwd)/.venv/bin/python" promptfoo eval -c promptfooconfig.saved.yaml

description: >
  HealthEval saved-output Promptfoo smoke run with DeepEval Constitutional health GEval.

prompts:
  - "{{prompt}}"

providers:
  - id: file://eval/promptfoo_saved_provider.py
    label: saved-healtheval-panel
    config:
      resultsPath: results/methodology_panel_refset_eval.json

tests:
  - path: file://eval/promptfoo_tests.py:generate_reference_set_tests
    config:
      referenceSetPath: data/reference_set.yaml
      modelIds:
        - sarvam-105b-conversations
        - sarvam-105b
        - claude-sonnet-4-6
        - gemini-2.5-pro

defaultTest:
  assert:
    - type: python
      metric: deepeval_constitutional_health
      value: file://eval/promptfoo_deepeval_assert.py:constitutional_health_geval

outputPath: results/promptfoo_saved.html
sharing: false
