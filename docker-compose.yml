# Saved-evidence workbench. Add compose.live.yml explicitly for provider access.
services:
  workbench:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${HEALTHEVAL_PORT:-8501}:8080"
    environment:
      PORT: "8080"
      HEALTHEVAL_STATE_DIR: /app/var
    volumes:
      - workbench_state:/app/var
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    init: true
    stop_grace_period: 30s

volumes:
  workbench_state:
