[project]
name = "healtheval"
version = "0.1.0"
description = "Evaluation and review tools for Hindi health chatbot responses."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
authors = [
    { name = "Jigyansu Rout", email = "jigyansu@riverline.ai" },
]

# Note: `promptfoo` is intentionally NOT listed here — it is an npm package
# installed reproducibly with `npm ci` using package-lock.json.
dependencies = [
    # data validation + config
    "pydantic>=2.6,<3",
    "pyyaml>=6.0,<7",
    "jsonschema>=4.21,<5",
    "python-dotenv>=1.0,<2",
    # dashboard/runtime UI
    "pandas>=2.2,<4",
    "plotly>=5.20,<7",
    "streamlit>=1.35,<2",
    # async + http
    "httpx>=0.27,<1",
    "krippendorff>=0.6,<1",
    "scipy>=1.12,<2",
    "statsmodels>=0.14,<1",
    "pingouin>=0.5,<1",
    # eval frameworks used for companion checks
    "deepeval>=1.0,<3",
    "inspect-ai>=0.3,<1",
    # vendor SDKs for the 4-model panel
    "anthropic>=0.40,<1",
    "google-genai>=0.3,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.3,<2",
    "ruff>=0.15,<1",
]

[project.urls]
Repository = "https://github.com/iamjr15/healtheval"
Documentation = "https://github.com/iamjr15/healtheval/tree/main/docs"
Issues = "https://github.com/iamjr15/healtheval/issues"

[tool.uv]
# This is a repository application, not a published Python library.
package = false

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Gate syntax, undefined names and invalid control flow across the codebase.
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "smoke: fast offline schema, parsing and configuration checks.",
    "integration: offline pipeline and evidence-contract tests with mocked provider boundaries.",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
