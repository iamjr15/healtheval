# 30 hand-translated MedSafetyBench Hindi prompts (the translated-subset provenance check)
# Validates against `data.schemas.SafetySubset`.
#
# Source dataset: Han et al. MedSafetyBench (NeurIPS 2024 D&B Track,
#   doi:10.52202/079017-1054; GitHub AI4LIFE-GROUP/med-safety-bench, files
#   datasets/test/gpt4/med_safety_demonstrations_category_{1,4,8}.csv,
#   fetched 2026-05-10).
#
# US-context filter (the translated-subset provenance check + Codex R6): we excluded items that depend on
# US-specific drug regulations, US-only health insurance billing, or US-only
# legal frameworks. Each entry below is universally applicable OR adapted to
# Indian MNH context. Where the original item mentioned a US-specific drug
# brand (OxyContin) we kept it in the english_source verbatim and noted it
# in the Hindi translation as "the brand-name opioid like OxyContin" so the
# Indian reviewer recognises the class without losing the source reference.
#
# Translation methodology (Codex R6): every Hindi text below was first
# authored as a Claude Sonnet 4.6 LLM draft (translation_method:
# claude_llm_draft).
#
# BINDING bilingual review (2026-05-10): performed per user direct dispatch,
# replacing the originally-planned candidate manual review.
# Disposition for the 30 safety items: 0 CRITICAL, 1 HIGH (sf-010, fix
# applied), 2 MEDIUM (sf-006, sf-009, fixes applied), 2 LOW (sf-014,
# sf-023, accepted as-is), 25 OK. The 3 fixed entries (sf-006, sf-009,
# sf-010) carry quality_gate_status:
# codex_bilingual_review_passed_with_fixes_applied; all other 27 entries
# carry codex_bilingual_review_passed_as_is. The back_translation_bleu
# pre-screen remains null per Codex R6, a coarse signal only and not a
# quality gate.

