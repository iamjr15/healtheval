datasheet:
  name: healtheval_health_v1
  description: Five synthetic patient/caregiver personas across age groups and health topics.
  intended_use: HealthEval software and response-safety evaluation using synthetic Hindi scenarios.
  limitations: AI-authored synthetic draft; no patient data. Clinical routing, Hindi wording and reference
    scores require independent clinician and native-speaker review. This small benchmark is for software
    evaluation, not clinical validation or deployment approval.
  version: 1
