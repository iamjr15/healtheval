panel:
- model_id: sarvam-105b-conversations
  provider: SARVAM
  base_url: https://api.sarvam.ai/v1
  api_key_env: SARVAM_API_KEY
  rate_limit_rpm: 60
  dispatch_type: API
  application_type: API
  cerai_provider: LOCAL
  notes: Current Sarvam conversational variant for Indic dialogue; API ID matches the reported model.
- model_id: sarvam-105b
  provider: SARVAM
  base_url: https://api.sarvam.ai/v1
  api_key_env: SARVAM_API_KEY
  rate_limit_rpm: 30
  dispatch_type: API
  application_type: API
  cerai_provider: LOCAL
  notes: Separately named reasoning comparator; API ID matches the reported model.
- model_id: claude-sonnet-4-6
  provider: ANTHROPIC
  base_url: https://api.anthropic.com/v1
  api_key_env: ANTHROPIC_API_KEY
  rate_limit_rpm: 50
  dispatch_type: API
  application_type: API
  cerai_provider: LOCAL
  notes: Independent model-family comparator; requires a funded and valid provider API key.
- model_id: gemini-2.5-pro
  provider: GOOGLE
  base_url: https://generativelanguage.googleapis.com/v1beta
  api_key_env: GOOGLE_API_KEY
  rate_limit_rpm: 60
  dispatch_type: API
  application_type: API
  cerai_provider: GEMINI
  notes: Independent model-family comparator; requires a funded and valid provider API key.
judge_panel:
- model_id: claude-sonnet-4-6
  provider: ANTHROPIC
  family: anthropic
  role: judge
  self_judging_avoidance: true
- model_id: gemini-2.5-pro
  provider: GOOGLE
  family: google
  role: judge
  self_judging_avoidance: true
- model_id: sarvam-105b
  provider: SARVAM
  family: sarvam
  role: judge
  self_judging_avoidance: true
datasheet:
  description: 'Four current chat candidates: Sarvam 105B Conversations, Sarvam 105B, Claude Sonnet 4.6
    and Gemini 2.5 Pro. Three judge families; related Sarvam variants never judge one another.'
  intended_use: Same broad-health system prompt across all candidate models; every result records the
    actual requested model ID.
  limitations: Source-grounded synthetic draft benchmark, not clinical validation. API availability and
    funding are checked before live evaluation. Sarvam model availability verified on 2026-09-13.
  version: 2
  sources:
  - name: Sarvam current chat API models
    url: https://docs.sarvam.ai/api-reference/chat/chat-completions
    paragraph_id: model and reasoning_effort
  - name: Sarvam changelog
    url: https://docs.sarvam.ai/changelog
    paragraph_id: 2026 model retirement notices
