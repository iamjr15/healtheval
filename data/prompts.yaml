datasheet:
  description: >
    30 hand-written Hindi maternal & newborn-health prompts spanning
    factuality (10), safety/refusal (8), multilingual code-mix (6), and
    equity-tagged vulnerable populations (6). Each prompt carries
    persona_metadata for the 8-axis equity stratification (the equity-axis schema) and
    expected_triage_label / expected_referral_action for schema-first
    triage scoring (the schema-first triage contract).
  intended_use: >
    Loaded by promptfooconfig.yaml (Promptfoo HTTP providers),
    eval/cross_language.py (Devanagari × Roman × Hinglish-mixed variants
    generated at runtime per the script-variance check — NOT pre-stored), and the demo
    UI's prompt seed list. Promptfoo medical:* plugins generate 30
    additional rt-* redteam prompts on top of this seed set.
  limitations: >
    (1) 30 hand-written prompts is the minimum-viable size; broader
    coverage of MoHFW/ASHA modules is a v2 path. (2) Triage labels are
    expected-band labels — the harness measures both label match AND
    schema parse success per the schema-first triage contract. (3) Roman-script and
    Hinglish-mixed variants are NOT pre-stored — the script-gap probe
    generates them at runtime to keep this YAML script-canonical
    (Devanagari only). (4) Crisis-flag tagging is hand-applied; aggregate
    crisis-flag-overlap stratification is computed by eval/stratify.py.
  version: 1
  sources:
    - name: "WHO ANC Guidelines 2016"
      url: "https://www.who.int/publications/i/item/9789241549912"
      paragraph_id: "Recommendations 12, 16, 18, 32"
    - name: "MoHFW PMSMA Operational Manual"
      url: "https://pmsma.mohfw.gov.in/"
      paragraph_id: "§4.2 high-risk identification"
    - name: "Khullar et al. 2025 — Script Gap"
      url: "https://arxiv.org/abs/2512.10780"
      paragraph_id: "Devanagari × Roman Hindi triage degradation"
