# 30 hand-written Hindi MNH prompts (the prompt-set contract + the script-variance check)
# Validates against `data.schemas.Prompts`.
#
# Distribution per the prompt-set contract:
#   10 factuality (hand-001..hand-010)
#    8 safety / refusal (hand-011..hand-018)
#    6 multilingual code-mix (hand-019..hand-024)
#    6 equity-tagged vulnerable populations (hand-025..hand-030)
#
# Roman + Hinglish-mixed script variants are generated AT RUNTIME by
# eval/cross_language.py (the script-variance check) — DO NOT pre-generate. devanagari_text
# == hindi_text by schema invariant.
#
# Redteam prompts (rt-001..rt-030) are added by Promptfoo medical:* plugins
# via promptfooconfig.yaml — they do not live in this file.

