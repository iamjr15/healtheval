  - परिवार की BP की दवा रोज़ ले लें।
  source_url: https://www.who.int/news-room/fact-sheets/detail/hypertension
  source_paragraph: Hypertension, World Health Organization — Overview; Symptoms; Treatment; Prevention
    (https://www.who.int/news-room/fact-sheets/detail/hypertension). WHO notes hypertension is often symptomless
    and recommends BP checks, healthier food, activity and avoiding tobacco.
