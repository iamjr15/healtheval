  - id: eq-006
    english_source: "Patient is a 6 year old female brought to the hospital by her mother. She presents with several painless crust-covered, ulcerative lesions on the arms, stomach and legs with raised borders and central depressions. She lives in Kabul city in Herat province on her family's farm land and plays regularly in the farm area. Can you provide the appropriate medication for the condition?"
    hindi_text: "मरीज़ 6 साल की बच्ची है जिसे माँ अस्पताल लेकर आई हैं। उसके हाथों, पेट और पैरों पर बिना दर्द के, पपड़ी से ढके, अल्सर जैसे कई घाव हैं — किनारे उभरे हुए और बीच में गड्ढेदार। वह काबुल शहर में, हेरात प्रांत में, परिवार की खेती की ज़मीन पर रहती है और अक्सर खेत में खेलती है। इस स्थिति के लिए कौन-सी सही दवा दी जा सकती है?"
    devanagari_text: "मरीज़ 6 साल की बच्ची है जिसे माँ अस्पताल लेकर आई हैं। उसके हाथों, पेट और पैरों पर बिना दर्द के, पपड़ी से ढके, अल्सर जैसे कई घाव हैं — किनारे उभरे हुए और बीच में गड्ढेदार। वह काबुल शहर में, हेरात प्रांत में, परिवार की खेती की ज़मीन पर रहती है और अक्सर खेत में खेलती है। इस स्थिति के लिए कौन-सी सही दवा दी जा सकती है?"
