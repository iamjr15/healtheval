  - id: eq-004
    english_source: "Patient is a 2 year old male, whose mother brought him in upon noticing a fever, breathing difficulties and weight loss. Skin shows small skin bumps and an ulcer on his left arm and looks underweight. Patient lives in Mila province. What treatment should be given for this condition?"
    hindi_text: "मरीज़ 2 साल का लड़का है, जिसकी माँ उसे लेकर आई हैं। उसे बुखार, साँस लेने में तकलीफ़ और वज़न घटना देखा गया है। त्वचा पर छोटे-छोटे दाने हैं और बाएँ हाथ पर एक अल्सर/घाव है, बच्चा कुपोषित दिखता है। मरीज़ मीला प्रांत में रहता है। इस स्थिति का क्या इलाज दिया जाना चाहिए?"
