datasheet:
  description: >
    60 hand-translated Hindi prompts curated from the EquityMedQA TRINDS
    subset (Pfohl et al. Nature Medicine 2024). Each prompt preserves
    the verbatim English source for auditability and pairs a Claude-LLM-
    drafted Hindi rendering with explicit equity_axis_tag (one of the 8
    axes in the equity-axis schema) and lead-defined 6-category equity taxonomy.
  intended_use: >
    Intended for companion evaluator checks (Promptfoo + cross-family jury +
    Inspect scorer + cross-language battery) as the equity slice. Per
    the source-corpus bundle1, results are reported as the EquityMedQA-derived equity
    operationalisation; per Pfohl et al.'s ablations 5-10 hand-picked
    items miss ~60% of equity failure modes, so n=60 is well above the
    inference threshold.
  limitations: >
    (1) Every Hindi text was first authored as a Claude Sonnet 4.6 LLM
    draft (translation_method: claude_llm_draft) and then bilingual-
    reviewed on 2026-05-10 per user direct dispatch
    (Codex R6 binding gate). 3 MEDIUM-flagged entries (eq-004, eq-006,
    eq-029) have re-translation fixes applied; 5 LOW-flagged entries
    (eq-012, eq-020, eq-021, eq-042, eq-049) accepted as-is per the
    review verdict; remaining 52 entries OK. (2) back_translation_bleu
    is null — Codex R6 framing: BLEU is a coarse pre-screen only, not a
    quality gate; the binding gate is the bilingual reviewer's verdict
    which is now reflected in each entry's quality_gate_status. (3)
    TRINDS is a tropical/neglected-disease scenario set; explicit-
    pregnancy items are only 2 of 60 — the file is best read as the
    equity-stratified clinical-reasoning slice of the 90-item
    adversarial subset, complementary to the 30 hand-written MNH-direct
    prompts in data/prompts.yaml. (4) Geographic place names are kept
    in Devanagari transliteration; Indian places use natural Hindi
    spelling, non-Indian places use phonetic transliteration.
  version: 2
  sources:
    - name: "Pfohl et al. EquityMedQA — Nature Medicine 2024"
      url: "https://www.nature.com/articles/s41591-024-03258-2"
      paragraph_id: "TRINDS subset construction §Methods"
    - name: "EquityMedQA HuggingFace dataset"
      url: "https://huggingface.co/datasets/katielink/EquityMedQA"
      paragraph_id: "equitymedqa_trinds.csv (105 prompts)"
    - name: "MaaSwasth README, Hindi adversarial subset documentation"
      url: "https://github.com/iamjr15/maaswasth-eval/blob/main/README.md"
      paragraph_id: "Literature And Source Map plus Data, Scoring Rules, And Result Files"
