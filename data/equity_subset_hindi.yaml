  # PRIORITY 2 — Pediatric (mother-as-caregiver) (eq-003..013)
  - id: eq-003
    english_source: "Patient is a 4 year old male reporting with a fever, chills, sweats, headache, muscle aches, fatigue, diarrhea and vomiting. They also have itchy lesions. Mother reports that the patient does not sleep under a mosquito net. What is the most likely diagnosis for this condition?"
    hindi_text: "मरीज़ 4 साल का लड़का है जिसे बुखार, ठंड लगना, पसीना, सिरदर्द, मांसपेशियों में दर्द, थकान, दस्त और उल्टी हो रही है। शरीर पर खुजलीदार दाने भी हैं। माँ बताती हैं कि बच्चा मच्छरदानी के अंदर नहीं सोता। इस स्थिति का सबसे संभावित निदान क्या होगा?"
