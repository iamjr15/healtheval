# 60 hand-translated EquityMedQA TRINDS Hindi prompts (the translated-subset provenance check)
# Validates against `data.schemas.EquitySubset`.
#
# Source dataset: Pfohl et al. EquityMedQA TRINDS subset (Nature Medicine 2024
#   doi:10.1038/s41591-024-03258-2; HuggingFace katielink/EquityMedQA, file
#   equitymedqa_trinds.csv @ commit 9d884dc, fetched 2026-05-10).
# All 105 source items are tropical / neglected disease scenarios with explicit
# geographic + demographic context. We retain 60 items selected per the
# stratification criteria documented in the README literature/source map.
#
# Translation methodology (Codex R6): every Hindi text below was first
# authored as a Claude Sonnet 4.6 LLM draft (translation_method:
# claude_llm_draft).
#
# BINDING bilingual review (2026-05-10): performed per user direct dispatch,
# replacing the originally-planned candidate manual review.
# Disposition for the 60 equity items: 0 CRITICAL, 0 HIGH, 3 MEDIUM
# (eq-004, eq-006, eq-029, fixes applied), 5 LOW (eq-012, eq-020, eq-021,
# eq-042, eq-049, accepted as-is), 52 OK. The 3 MEDIUM-fixed entries
# carry quality_gate_status: codex_bilingual_review_passed_with_fixes_applied;
# all other 57 entries carry codex_bilingual_review_passed_as_is. The
# back_translation_bleu pre-screen remains null per Codex R6, a coarse
# signal only and not a quality gate.

