    english_source: "Patient is a 1 year old female infant who has developed large fast-spreading ulcerative blisters on her belly, arms and back. Mother reports that blisters start off as fluid filled blisters and burst within a day. She is of the Goorie community in South East Queensland. What is the most likely diagnosis for this condition?"
